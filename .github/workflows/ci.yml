name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_driver:
    name: Build the pinned driver from source
    runs-on: ubuntu-24.04
    # Build on the oldest supported CI image so the executable runs in every test job.
    container: ubuntu:20.04
    outputs:
      driver-version: ${{ steps.package.outputs.driver-version }}
    env: &source_environment
      DEBIAN_FRONTEND: noninteractive
      SCCACHE_DIR: /opt/rules_xlsynth-ci/sccache
    defaults:
      run:
        shell: bash
    steps:
      - &focal_setup
        name: Install Ubuntu 20.04 prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git gnupg unzip build-essential python3
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/focal/ llvm-toolchain-focal-18 main' > /etc/apt/sources.list.d/llvm18.list
          apt-get update
          apt-get install -y libc++-18-dev libc++abi-18-dev

      - uses: actions/checkout@v4

      - &source_setup
        name: Install source build prerequisites
        run: |
          apt-get install -y pkg-config libssl-dev zlib1g-dev patchelf zstd
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v29.1/protoc-29.1-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          unzip -j "$RUNNER_TEMP/protoc.zip" bin/protoc -d /usr/local/bin
          protoc --version
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | CARGO_HOME=/opt/rules_xlsynth-ci/cargo sh -s -- -y --profile minimal --default-toolchain none
          echo "/opt/rules_xlsynth-ci/cargo/bin" >> "$GITHUB_PATH"
          python3 scripts/install_ci_bitwuzla.py

      - &setup_bazel
        name: Set up Bazelisk
        run: |
          mkdir -p "$RUNNER_TEMP/bazelisk"
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.23.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk/bazel"
          chmod +x "$RUNNER_TEMP/bazelisk/bazel"
          echo "$RUNNER_TEMP/bazelisk" >> "$GITHUB_PATH"

      - &prepare_cache
        name: Set up sccache and identify the floating Rust nightly
        id: cache-key
        run: |
          release=sccache-v0.16.0-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v0.16.0/$release.tar.gz" -o "$RUNNER_TEMP/sccache.tar.gz"
          echo "aec995a83ad3dff3d14b6314e08858b7b73d35ca85a5bcf3d3a9ec07dee35588  $RUNNER_TEMP/sccache.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C /usr/local/bin --strip-components=1 "$release/sccache"
          sccache --version
          mkdir -p "$SCCACHE_DIR"
          install -D -m 0755 scripts/ci_driver_cache/rustup /opt/rules_xlsynth-ci/bin/rustup
          echo /opt/rules_xlsynth-ci/bin >> "$GITHUB_PATH"
          manifest=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-nightly.toml.sha256)
          echo "nightly=${manifest%% *}" >> "$GITHUB_OUTPUT"

      - &restore_cache
        name: Restore the Rust compiler cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: driver-sccache-v1-focal-${{ github.job }}-${{ steps.cache-key.outputs.nightly }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: driver-sccache-v1-focal-${{ github.job }}-${{ steps.cache-key.outputs.nightly }}-

      - name: Build and test the download_only toolchain
        run: |
          time bazel test -c opt --sandbox_writable_path="$SCCACHE_DIR" --test_output=errors \
            //:external_bundle_exports_test

      - &save_cache
        name: Save the Rust compiler cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - name: Check and package the driver
        id: package
        run: |
          exec_root=$(bazel info execution_root)
          driver=$(bazel cquery -c opt --output=files @rules_xlsynth_source_xls_toolchain//:xlsynth-driver)
          libxls=$(bazel cquery -c opt --output=files @rules_xlsynth_source_xls_runtime//:libxls_file)
          expected=$(awk -F'"' '/^crate[[:space:]]*=/ {print $2}' xlsynth-versions.toml)
          actual=$(LD_LIBRARY_PATH="$(dirname "$exec_root/$libxls")" "$exec_root/$driver" --version)
          echo "$actual"
          test "$actual" = "xlsynth-driver $expected"
          tar -czf "$RUNNER_TEMP/xlsynth-driver.tar.gz" -C "$(dirname "$exec_root/$driver")" xlsynth-driver
          echo "driver-version=$expected" >> "$GITHUB_OUTPUT"

      - name: Upload the executable for the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: xlsynth-driver
          path: ${{ runner.temp }}/xlsynth-driver.tar.gz
          if-no-files-found: error
          compression-level: 0

  compat_driver:
    name: Build and test the older release pair
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    env: *source_environment
    defaults:
      run:
        shell: bash
    steps:
      - *focal_setup
      - uses: actions/checkout@v4
      - *source_setup
      - *setup_bazel
      - *prepare_cache
      - *restore_cache
      - name: Build and test the compatibility pipeline
        run: |
          time bazel test -c opt --sandbox_writable_path="$SCCACHE_DIR" --test_output=errors \
            --extra_toolchains=@compat_xls_toolchain//:toolchain //compatibility:older_release_pipeline_test
      - *save_cache

  dslx_ci:
    needs: build_driver
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    name: dslx_ci (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          python scripts/install_ci_bitwuzla_test.py
          sudo "$(command -v python)" scripts/install_ci_bitwuzla.py

      - *setup_bazel

      - &download_driver
        name: Download the source-built driver
        uses: actions/download-artifact@v4
        with:
          name: xlsynth-driver
          path: ${{ runner.temp }}

      - &presubmit
        name: Run presubmit with the shared driver
        shell: bash
        env:
          DRIVER_VERSION: ${{ needs.build_driver.outputs.driver-version }}
        run: |
          tar -xzf "$RUNNER_TEMP/xlsynth-driver.tar.gz" -C "$RUNNER_TEMP"
          driver="/opt/rules_xlsynth-ci/drivers/$DRIVER_VERSION/bin/xlsynth-driver"
          as_root=()
          if [[ $(id -u) != 0 ]]; then as_root=(sudo); fi
          "${as_root[@]}" install -D -m 0755 "$RUNNER_TEMP/xlsynth-driver" "$driver"

          # Fail if a test falls back to a Rust build instead of using the uploaded driver.
          mkdir -p "$RUNNER_TEMP/no-cargo"
          ln -s /bin/false "$RUNNER_TEMP/no-cargo/rustup"
          PATH="$RUNNER_TEMP/no-cargo:$PATH" python run_presubmit.py --ci-driver "$driver"

  dslx_ci_py36:
    needs: build_driver
    runs-on: ubuntu-24.04
    # The main branch ruleset requires this exact historical check name.
    name: dslx_ci (Python 3.6.8 in ubuntu:20.04 container)
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - *focal_setup

      - uses: actions/checkout@v4

      - name: Set up Python 3.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.6.15"

      - name: Install Bitwuzla runtime dependencies
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 6), sys.version'
          if ! command -v python3.6 >/dev/null; then
            ln -s "$(command -v python)" /usr/local/bin/python3.6
          fi
          python3.6 scripts/install_ci_bitwuzla_test.py
          python3.6 scripts/install_ci_bitwuzla.py

      - *setup_bazel
      - *download_driver
      - *presubmit
